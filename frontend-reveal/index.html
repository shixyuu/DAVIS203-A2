<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Digital Wasteland — Multi-Device Surveillance Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Serif+SC:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body tabindex="-1">
  <!-- Subtle Ambient Mesh Background -->
  <div class="ambient-mesh" aria-hidden="true"></div>

  <!-- Header HUD -->
  <header class="top">
    <div class="brand">
      <span class="dot is-offline" id="live-dot"></span>
      <span class="brand-mark">DIGITAL WASTELAND · ARCHIVE</span>
    </div>
    <div class="hud" id="hud" aria-live="polite">
      <span>STANDBY</span>
    </div>
  </header>

  <!-- Multi-Device Side-by-Side Centered Stage -->
  <main class="stage" id="stage" aria-label="Surveillance stage">
    <div class="device-lanes" id="lanes">
      <!-- Device lanes will be dynamically injected side-by-side -->
    </div>
  </main>

  <!-- Bottom Interaction Hint -->
  <div class="hint" id="hint">SCROLL / DRAG DECK TO INSPECT HISTORY · AUTO-FOLLOWS LATEST FEED</div>

  <script type="module" src="./reveal.js"></script>
</body>
</html>
