<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Digital Wasteland — Surveillance Archive (Captive Deck)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body tabindex="-1">
  <!-- CRT Scanlines and Edge Vignette -->
  <div class="veil" aria-hidden="true"></div>

  <!-- Header Surveillance HUD -->
  <header class="top">
    <div class="brand">
      <span class="dot is-offline" id="live-dot"></span>
      <span class="brand-mark">DIGITAL WASTELAND</span>
    </div>
    <div class="hud" id="hud" aria-live="polite">
      <span>STANDBY</span>
    </div>
  </header>

  <!-- Jump to Newest Clip Pill -->
  <button type="button" class="fresh" id="fresh" hidden aria-label="Jump to newest">
    <span class="fresh-dot"></span><span id="fresh-n">+1</span>
  </button>

  <!-- 3D Stacked Surveillance Deck -->
  <main class="deck" id="deck" aria-label="Surveillance stack" tabindex="0">
    <div class="ghost is-portrait" id="ghost" aria-hidden="true">
      <div class="ghost-frame"></div>
      <div class="ghost-tag"></div>
      <span class="ghost-label">AWAITING TELEMETRY FEED</span>
    </div>
  </main>

  <!-- History Navigation Rail -->
  <nav class="rail" id="rail" aria-label="History"></nav>

  <!-- Bottom Interactive Guide -->
  <div class="hint" id="hint" aria-hidden="true">SCROLL &nbsp;·&nbsp; DRAG &nbsp;·&nbsp; ↑ ↓ TO INSPECT</div>

  <script type="module" src="./reveal.js"></script>
</body>
</html>
