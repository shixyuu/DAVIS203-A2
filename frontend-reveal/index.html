<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Digital Wasteland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body tabindex="-1">
  <!-- Subtle Ambient Mesh Background -->
  <div class="ambient-mesh" aria-hidden="true"></div>

  <!-- Multi-Device Side-by-Side Centered Stage -->
  <main class="stage" id="stage" aria-label="Surveillance stage">
    <div class="device-lanes" id="lanes">
      <!-- Device lanes will be dynamically injected side-by-side -->
    </div>
  </main>

  <!-- Minimal Clear Cache Trigger (Bottom-Right Discrete Control) -->
  <div class="bottom-controls">
    <div class="telemetry-pill" id="telemetry-pill">
      <span class="pill-dot"></span>
      <span id="telemetry-time">FEED: STANDBY</span>
    </div>
    <button type="button" class="btn-clear" id="btn-clear" title="Clear all cached footage" aria-label="Clear cached footage">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>
      </svg>
      <span>CLEAR ARCHIVE</span>
    </button>
  </div>

  <script type="module" src="./reveal.js"></script>
</body>
</html>
