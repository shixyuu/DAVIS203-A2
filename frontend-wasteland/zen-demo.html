<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zen / 枯山水·水墨禅意 交互视觉 Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0c;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Serif SC", serif;
      color: #e2e8f0;
    }
    #zen-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }
    .hud-header {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
    }
    .hud-title {
      font-size: 20px;
      letter-spacing: 0.25em;
      font-weight: 300;
      color: rgba(240, 243, 246, 0.88);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .hud-sub {
      font-size: 11px;
      letter-spacing: 0.18em;
      color: rgba(148, 163, 184, 0.65);
    }
    .control-panel {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      border-radius: 999px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    }
    .style-pill {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(203, 213, 225, 0.75);
      padding: 6px 14px;
      font-size: 12px;
      letter-spacing: 0.1em;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }
    .style-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .style-pill.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      box-shadow: 0 0 8px #10b981;
    }
    .guide-tip {
      position: absolute;
      top: 24px;
      right: 32px;
      z-index: 10;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(148, 163, 184, 0.55);
      pointer-events: none;
      text-align: right;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="hud-header">
    <div class="hud-title">枯山水 · 水墨余韵 (Zen Wasteland Demo)</div>
    <div class="hud-sub">禅意交互视觉概念提案 · 拖拽或点击画布体验涟漪散逸</div>
  </div>

  <div class="guide-tip">
    <div><span class="status-dot"></span>Cloudflare Worker 状态：双向连通可就绪</div>
    <div>长按画圆拖拽，体验烟岚化境与枯石涟漪</div>
  </div>

  <div class="control-panel">
    <button class="style-pill active" data-theme="ink">水墨淡雅 (Ink Wash)</button>
    <button class="style-pill" data-theme="sand">枯山白砂 (Zen Sand)</button>
    <button class="style-pill" data-theme="bamboo">青竹微雨 (Mist Bamboo)</button>
    <button class="style-pill" data-theme="tea">孤茶余温 (Warm Amber)</button>
  </div>

  <canvas id="zen-canvas"></canvas>

  <script type="module">
    const canvas = document.getElementById("zen-canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    let width = window.innerWidth;
    let height = window.innerHeight;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * window.devicePixelRatio;
      canvas.height = height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // 禅意主题调色板
    const THEMES = {
      ink: {
        bg: "rgba(10, 11, 14, 0.15)",
        baseFog: { r: 180, g: 185, b: 195 },
        ripples: { r: 215, g: 220, b: 230 },
        accent: { r: 130, g: 155, b: 180 },
        lineTone: "rgba(220, 225, 235, 0.15)",
      },
      sand: {
        bg: "rgba(18, 17, 15, 0.15)",
        baseFog: { r: 210, g: 195, b: 175 },
        ripples: { r: 235, g: 220, b: 195 },
        accent: { r: 200, g: 160, b: 120 },
        lineTone: "rgba(235, 220, 200, 0.18)",
      },
      bamboo: {
        bg: "rgba(9, 14, 12, 0.15)",
        baseFog: { r: 160, g: 205, b: 180 },
        ripples: { r: 180, g: 230, b: 205 },
        accent: { r: 100, g: 185, b: 145 },
        lineTone: "rgba(180, 225, 200, 0.16)",
      },
      tea: {
        bg: "rgba(16, 12, 10, 0.15)",
        baseFog: { r: 225, g: 180, b: 140 },
        ripples: { r: 245, g: 205, b: 165 },
        accent: { r: 235, g: 145, b: 90 },
        lineTone: "rgba(240, 190, 150, 0.18)",
      }
    };

    let currentTheme = THEMES.ink;

    // 粒子 & 涟漪 & 枯山水流线
    const ripples = [];
    const inkDrops = [];
    const motes = [];

    // 初始化微尘/茶沫飘忽
    for (let i = 0; i < 90; i++) {
      motes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2,
        r: 1.2 + Math.random() * 2.5,
        alpha: 0.1 + Math.random() * 0.35,
        phase: Math.random() * Math.PI * 2,
      });
    }

    function addZenRipple(x, y, strength = 1.0) {
      ripples.push({
        x,
        y,
        radius: 10,
        maxRadius: 180 + Math.random() * 80 * strength,
        alpha: 0.5 * strength,
        speed: 0.75 + Math.random() * 0.45,
        rings: 2 + Math.floor(Math.random() * 2),
      });

      // 墨韵散开
      inkDrops.push({
        x,
        y,
        r: 30 + Math.random() * 30,
        maxR: 90 + Math.random() * 60,
        alpha: 0.35 * strength,
        life: 1.0,
      });

      if (ripples.length > 35) ripples.shift();
      if (inkDrops.length > 25) inkDrops.shift();
    }

    // 交互监听
    let isPointerDown = false;
    canvas.addEventListener("pointerdown", (e) => {
      isPointerDown = true;
      addZenRipple(e.clientX, e.clientY, 1.4);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (isPointerDown || Math.random() < 0.25) {
        addZenRipple(e.clientX, e.clientY, isPointerDown ? 0.9 : 0.4);
      }
    });
    window.addEventListener("pointerup", () => isPointerDown = false);

    // 切换调色主题
    document.querySelectorAll(".style-pill").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".style-pill").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTheme = THEMES[btn.dataset.theme];
      });
    });

    let time = 0;
    function render() {
      time += 0.01;

      // 1. 留白淡雅清底 (柔和的拖尾淡入淡出，体现水墨宣纸浸染感)
      ctx.fillStyle = currentTheme.bg;
      ctx.fillRect(0, 0, width, height);

      // 2. 枯山水同心砂纹 (柔和的基底水波暗纹)
      ctx.save();
      ctx.lineWidth = 1;
      const t = currentTheme.ripples;
      for (let i = 0; i < 4; i++) {
        const waveY = (height * (i + 1)) / 5;
        ctx.strokeStyle = currentTheme.lineTone;
        ctx.beginPath();
        for (let x = 0; x <= width; x += 25) {
          const dy = Math.sin(x * 0.003 + time * 0.5 + i) * 18 + Math.cos(x * 0.008 - time * 0.3) * 8;
          if (x === 0) ctx.moveTo(x, waveY + dy);
          else ctx.lineTo(x, waveY + dy);
        }
        ctx.stroke();
      }
      ctx.restore();

      // 3. 水墨晕染 (Ink Wash Blobs)
      ctx.save();
      for (let i = inkDrops.length - 1; i >= 0; i--) {
        const ink = inkDrops[i];
        ink.r += (ink.maxR - ink.r) * 0.035;
        ink.life -= 0.006;
        if (ink.life <= 0) {
          inkDrops.splice(i, 1);
          continue;
        }
        const grad = ctx.createRadialGradient(ink.x, ink.y, 0, ink.x, ink.y, ink.r);
        const { r, g, b } = currentTheme.accent;
        const curA = (ink.alpha * ink.life).toFixed(3);
        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${curA})`);
        grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, ${(curA * 0.45)})`);
        grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(ink.x, ink.y, ink.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 4. 禅意圆环涟漪 (Zen Concentric Water Circles)
      ctx.save();
      for (let i = ripples.length - 1; i >= 0; i--) {
        const rip = ripples[i];
        rip.radius += rip.speed;
        rip.alpha -= 0.0045;

        if (rip.alpha <= 0 || rip.radius >= rip.maxRadius) {
          ripples.splice(i, 1);
          continue;
        }

        const { r, g, b } = currentTheme.ripples;
        for (let ring = 0; ring < rip.rings; ring++) {
          const ringR = rip.radius - ring * 16;
          if (ringR <= 0) continue;
          const ringAlpha = (rip.alpha * (1 - ring * 0.32)).toFixed(3);
          ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${ringAlpha})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(rip.x, rip.y, ringR, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
      ctx.restore();

      // 5. 飘散的微尘与香篆浮烟 (Suspended Zen Motes)
      ctx.save();
      for (let m of motes) {
        m.x += m.vx + Math.sin(time + m.phase) * 0.2;
        m.y += m.vy + Math.cos(time * 0.8 + m.phase) * 0.2;
        if (m.x < 0) m.x = width;
        if (m.x > width) m.x = 0;
        if (m.y < 0) m.y = height;
        if (m.y > height) m.y = 0;

        const { r, g, b } = currentTheme.baseFog;
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${m.alpha})`;
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
